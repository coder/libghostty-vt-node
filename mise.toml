[tools]
communique = "1.0.3"
node = "26.12.1"
zig = "0.15.2"

[tasks.ci]
description = "Install dependencies, build libghostty-vt/native/TypeScript, run tests, and run smoke."
run = [
  "npm ci",
  "npm run build:libghostty",
  "npm run build:native",
  "npm run build",
  "npm test",
  "npm run smoke",
]

[tasks.ci-ubsan]
description = "Build the native addon with UBSan, then run tests and smoke so undefined behavior aborts the run."
run = [
  "npm ci",
  "npm run build:libghostty",
  # GCC's "undefined" group leaves out float-cast-overflow.
  "CXXFLAGS=\"-fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all\" LDFLAGS=\"-fsanitize=undefined,float-cast-overflow\" npm run build:native",
  "nm -u $(find build/Release -name '*.o') | grep -q '__ubsan_handle_.*_abort' || { echo \"error: the addon was built without UBSan\" >&2; exit 1; }",
  "npm test",
  "npm run smoke",
]

[tasks.release-prebuilds]
description = "Build and verify npm-bundled Node-API prebuild artifacts."
run = [
  "npm ci",
  "npm run build:libghostty",
  "npm run build",
  "npm run build:prebuild",
  "npm run verify:prebuilds",
  "npm pack --dry-run",
]

[tasks.assemble-prebuilds]
description = "Assemble per-platform GitHub Actions prebuild artifacts into npm package layout."
run = "npm run assemble:prebuilds"

[tasks.create-release-tag]
description = "Create the package-version Git tag for a merged release/v* PR."
run = "npm run release:create-tag"

[tasks.publish-dry-run]
description = "Assemble release artifacts and verify the npm package that would be published."
run = [
  "npm ci",
  "npm run build",
  "mise run assemble-prebuilds",
  "npm run verify:prebuilds",
  "npm run resolve:publish-tag",
  "npm pack --dry-run",
]

[tasks.publish]
description = "Assemble release artifacts and publish the npm package with trusted publishing."
run = [
  "npm ci",
  "npm run build",
  "mise run assemble-prebuilds",
  "npm run verify:prebuilds",
  "npm run resolve:publish-tag",
  "npm pack --dry-run",
  "npm publish --access public --tag \"$(node scripts/resolve-npm-publish-tag.mjs)\"",
]
