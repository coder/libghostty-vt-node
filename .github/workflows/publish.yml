name: publish

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "Optional npm dist-tag override. Leave unset for tag-derived beta/alpha/rc/latest."
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*.*.*"
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: true

jobs:
  prebuilds:
    name: prebuilds (${{ matrix.target }})
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-14
          - target: macos-x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
      - uses: jdx/mise-action@v3
      - run: mise run release-prebuilds
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/**
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: prebuilds
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
      - uses: jdx/mise-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: .release-artifacts
      - run: mise run create-release-tag
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          RELEASE_TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      - run: mise run publish
        env:
          NPM_PUBLISH_TAG: ${{ inputs.npm_tag }}
