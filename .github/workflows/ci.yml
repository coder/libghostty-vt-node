name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  MISE_LOCKED: true

jobs:
  ci:
    name: ci (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            task: ci
          - target: linux-arm64
            os: ubuntu-24.04-arm
            task: ci
          - target: macos-arm64
            os: macos-15
            task: ci
          - target: linux-x64-ubsan
            os: ubuntu-latest
            task: ci-ubsan
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run ${{ matrix.task }}
      # GitHub's x64 runners differ in CPU features, so a passing run proves
      # nothing about older CPUs. Run the addon on an emulated baseline CPU.
      # The runner's system libraries come from Ubuntu's amd64v3 variant, and
      # Node without the addon dies on qemu64 there, so the check runs in an
      # ubuntu:24.04 container, whose libraries target the x86-64 baseline.
      - if: matrix.target == 'linux-x64'
        run: mise run check-baseline-cpu
        env:
          BASELINE_CPU_IMAGE: ubuntu:24.04
