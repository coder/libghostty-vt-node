name: release-prebuilds

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  MISE_LOCKED: true

jobs:
  release-prebuilds:
    name: prebuilds (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run release-prebuilds
      # The runner's CPU decides nothing here: the prebuild must run on a
      # generic x86-64 CPU, as users' machines can lack AVX-512 or AVX2.
      - if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - if: matrix.target == 'linux-x64'
        run: mise run check-baseline-cpu
        env:
          PREBUILDS_ONLY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/**
          if-no-files-found: error
