name: release-prebuilds

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true
  MISE_LOCKED: true

jobs:
  release-prebuilds:
    name: prebuilds (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run release-prebuilds
      # The runner's CPU decides nothing here: the prebuild must run on a
      # generic x86-64 CPU, as users' machines can lack AVX-512 or AVX2.
      # The runner's system libraries come from Ubuntu's amd64v3 variant, and
      # Node without the addon dies on qemu64 there, so the check runs in an
      # ubuntu:24.04 container, whose libraries target the x86-64 baseline.
      - if: matrix.target == 'linux-x64'
        run: mise run check-baseline-cpu
        env:
          BASELINE_CPU_IMAGE: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
          PREBUILDS_ONLY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/**
          if-no-files-found: error
